services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filmbox-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${PGUSER}:${PGPASSWORD}@postgres:${PGPORT:-5432}/${PGDATABASE:-filmbox}
      PGHOST: postgres
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-filmbox}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - filmbox-network

  postgres:
    image: postgres:16-alpine
    container_name: filmbox-pg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-filmbox}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE:-filmbox}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - filmbox-network

volumes:
  pgdata:
    driver: local

networks:
  filmbox-network:
    driver: bridge